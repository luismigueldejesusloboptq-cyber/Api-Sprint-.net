<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Lanchonete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f7f6;
            display: flex;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            max-width: 400px;
            margin: auto;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h2 class="text-center mb-4">Acesso ao Dashboard</h2>
            <div class="mb-3">
                <input type="email" id="email" class="form-control" placeholder="Seu email">
            </div>
            <div class="mb-3">
                <input type="password" id="senha" class="form-control" placeholder="Sua senha">
            </div>
            <button class="btn btn-primary w-100" onclick="login()">Entrar</button>
            <p id="mensagemErro" class="text-danger mt-3 text-center"></p>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
