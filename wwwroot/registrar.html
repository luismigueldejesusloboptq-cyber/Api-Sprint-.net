<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Lanchonete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card mx-auto p-4" style="max-width: 400px;">
            <h3 class="text-center mb-4">Criar Conta</h3>
            <div class="mb-3">
                <label class="form-label">Nome Completo</label>
                <input type="text" id="regNome" class="form-control" placeholder="Ex: João Silva">
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" id="regEmail" class="form-control" placeholder="email@exemplo.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" id="regSenha" class="form-control" placeholder="******">
            </div>
            <button class="btn btn-success w-100 mb-3" onclick="registrar()">Cadastrar</button>
            <div class="text-center">
                <a href="login.html" class="text-decoration-none">Já tenho conta? Entrar</a>
            </div>
        </div>
    </div>

    <script>
        async function registrar() {
            const nome = document.getElementById("regNome").value;
            const email = document.getElementById("regEmail").value;
            const senha = document.getElementById("regSenha").value;

            if(!nome || !email || !senha) {
                alert("Preencha todos os campos!");
                return;
            }

            try {
                const response = await fetch("/api/auth/registrar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nome, email, senha })
                });

                if (response.ok) {
                    alert("Usuário criado com sucesso!");
                    window.location.href = "login.html";
                } else {
                    const msg = await response.text();
                    alert("Erro: " + msg);
                }
            } catch (error) {
                alert("Erro ao conectar com a API.");
            }
        }
    </script>
</body>
</html>
